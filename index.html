    --c6: #8a4fc9; /* Violet */
    --c7: #ee6fa0; /* Rose */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--board-bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 14px 60px;
    position: relative;
  }

  .bg-photo {
    position: fixed;
    inset: -20px;
    background-image: var(--bg-landscape);
    background-size: cover;
    background-position: center;
    filter: blur(7px) brightness(0.55);
    transform: scale(1.05);
    z-index: -2;
  }
  @media (max-width: 640px) {
    .bg-photo { background-image: var(--bg-portrait); }
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 35%, rgba(36,26,48,0.55) 0%, rgba(36,26,48,0.88) 60%, rgba(20,14,28,0.96) 100%);
    z-index: -1;
  }

  .app { width: 100%; max-width: 460px; }

  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 2px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
    margin: 0 0 26px;
  }

  .card {
    background: var(--panel-bg);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* --- Menu --- */
  .colorcount-label { text-align: center; font-size: 13px; color: var(--ink-dim); margin-bottom: 10px; }
  .colorcount-picker { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .cc-option {
    flex: 1; max-width: 90px;
    background: var(--panel-bg-light);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--ink-dim);
    border-radius: 10px;
    padding: 10px 0;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .cc-option.active { border-color: var(--gold); color: var(--gold); background: rgba(217,164,65,0.1); }

  .session-history { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  .session-history .sh-title { font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; text-align: center; }
  .sh-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); padding: 4px 2px; }
  .sh-row b { color: var(--ink); }

  .mode-btn {
    width: 100%;
    text-align: left;
    background: var(--panel-bg-light);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--ink);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .mode-btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .mode-btn .big { font-size: 17px; font-weight: 700; display:block; margin-bottom:4px; }
  .mode-btn .small { font-size: 13px; color: var(--ink-dim); }

  /* --- Board rows --- */
  .history { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; max-height: 46vh; overflow-y: auto; padding-right: 2px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.18);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .row .num { font-size: 12px; color: var(--ink-dim); width: 18px; flex-shrink:0; }
  .pegs { display: flex; gap: 8px; }
  .peg {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -3px 5px rgba(0,0,0,0.25);
  }
  .peg.empty { background: var(--slot-empty); border-style: dashed; box-shadow:none; }

  .feedback-mini { display: grid; grid-template-columns: repeat(2, 8px); grid-template-rows: repeat(2, 8px); gap: 3px; margin-left: 10px; flex-shrink:0; }
  .fpeg { width: 8px; height: 8px; border-radius: 50%; }
  .fpeg.black { background: #141014; }
  .fpeg.white { background: #f2ece2; }
  .fpeg.none { background: transparent; }

  /* --- Current guess row --- */
  .current-row { text-align: center; margin-bottom: 16px; }
  .current-row .label { font-size: 13px; color: var(--ink-dim); margin-bottom: 10px; }
  .slots { display: flex; justify-content: center; gap: 12px; margin-bottom: 4px; }
  .slot {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--slot-empty);
    border: 2px dashed rgba(255,255,255,0.25);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .slot.filled { border-style: solid; border-color: rgba(255,255,255,0.2); box-shadow: inset 0 3px 6px rgba(255,255,255,0.3), inset 0 -4px 6px rgba(0,0,0,0.3); }
  .slot.selected { outline: 2px solid var(--gold); outline-offset: 2px; }
  .slot:active { transform: scale(0.94); }

  /* --- Palette --- */
  .palette { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
  .swatch {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    cursor: pointer;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -3px 5px rgba(0,0,0,0.25);
  }
  .swatch:active { transform: scale(0.9); }

  /* --- Feedback input (mode: computer guesses) --- */
  .fb-instructions { font-size: 13px; color: var(--ink-dim); text-align:center; margin-bottom: 14px; line-height: 1.5; }
  .counters { display: flex; justify-content: center; gap: 24px; margin-bottom: 18px; }
  .counter { text-align: center; }
  .counter .clabel { font-size: 13px; color: var(--ink-dim); margin-bottom: 8px; }
  .counter .crow { display: flex; align-items: center; gap: 10px; }
  .counter .cval { font-size: 22px; font-weight: 800; width: 26px; text-align: center; }
  .cbtn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: var(--panel-bg-light);
    color: var(--ink);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center;
  }
  .cbtn:hover { border-color: var(--gold); }
  .cbtn:disabled { opacity: 0.3; cursor: not-allowed; }
  .fb-total-warning { text-align: center; font-size: 12px; color: var(--danger); margin: -8px 0 14px; min-height: 14px; }

  .remaining {
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 14px;
  }
  .remaining b { color: var(--gold); }

  .poss-graph {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    height: 60px;
    margin-bottom: 18px;
    padding: 0 4px;
  }
  .pg-bar {
    width: 16px;
    min-height: 2px;
    border-radius: 3px 3px 0 0;
    background: var(--panel-bg-light);
    position: relative;
    transition: height 0.3s ease;
  }
  .pg-bar.current { background: var(--gold); }
  .pg-bar .pg-val {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  .attempts-left { text-align: center; font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; }
  .attempts-left b { color: var(--gold); }
  .attempts-left.low b { color: var(--danger); }

  /* --- Buttons --- */
  .btn {
    display:block; width: 100%;
    background: var(--gold);
    color: #241a30;
    border: none; border-radius: 12px;
    padding: 13px;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #e6b25a; }
  .btn:disabled { background: #6a5c7f; color: #b9aec6; cursor: not-allowed; }
  .btn.secondary { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--ink); margin-top: 10px; }
  .btn.secondary:hover { border-color: var(--gold); background: transparent; }

  .status { text-align: center; font-size: 14px; color: var(--ink-dim); margin-bottom: 14px; min-height: 18px; }
  .status.thinking { color: var(--gold); }
  .status.win { color: #6fce8c; font-weight: 700; font-size: 16px; animation: winPulse 0.6s ease; }

  @keyframes winPulse {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  .confetti-piece {
    position: fixed;
    top: -12px;
    width: 8px; height: 14px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(540deg); opacity: 0.4; }
  }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; font-size: 11px; color: var(--ink-dim); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display:inline-block; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bg-photo"></div>
<div class="bg-overlay"></div>
<div class="app">
  <h1>Mastermind</h1>
  <p class="subtitle" id="subtitle">8 couleurs · 4 trous</p>

  <div class="card">

    <!-- MENU -->
    <div id="menu">
      <div class="colorcount-label">Nombre de couleurs</div>
      <div class="colorcount-picker" id="colorCountPicker"></div>

      <div class="colorcount-label">Nombre d'essais max (mode « tu devines »)</div>
      <div class="colorcount-picker" id="attemptsPicker"></div>

      <button class="mode-btn" onclick="startGame('computerGuesses')">
        <span class="big">🧠 Je cache un code</span>
        <span class="small">Tu penses à une combinaison, l'ordinateur essaie de la deviner.</span>
      </button>
      <button class="mode-btn" onclick="startGame('userGuesses')">
        <span class="big">🔍 L'ordinateur cache un code</span>
        <span class="small">Un code secret est tiré au hasard, à toi de le deviner.</span>
      </button>

      <div id="sessionHistory"></div>
    </div>

    <!-- GAME -->
    <div id="game" class="hidden">
      <div class="history" id="history"></div>
      <div class="status" id="status"></div>

      <!-- Current guess (mode: userGuesses) -->
      <div id="userInputArea" class="hidden">
        <div class="attempts-left hidden" id="attemptsLeft"></div>
        <div class="current-row">
          <div class="label">Compose ta proposition</div>
          <div class="slots" id="slots"></div>
        </div>
        <div class="palette" id="palette"></div>
        <button class="btn" id="submitGuessBtn" onclick="submitUserGuess()" disabled>Valider la proposition</button>
      </div>

      <!-- Feedback input (mode: computerGuesses) -->
      <div id="feedbackInputArea" class="hidden">
        <div class="current-row">
          <div class="label">Ma proposition</div>
          <div class="slots" id="computerGuessDisplay"></div>
        </div>
        <div class="fb-instructions">Combien de couleurs sont bien placées, et combien sont présentes mais mal placées ?</div>
        <div class="counters">
          <div class="counter">
            <div class="clabel">Bien placés</div>
            <div class="crow">
              <button class="cbtn" onclick="changeCounter('black', -1)">−</button>
              <div class="cval" id="blackVal">0</div>
              <button class="cbtn" onclick="changeCounter('black', 1)">+</button>
            </div>
          </div>
          <div class="counter">
            <div class="clabel">Mal placés</div>
            <div class="crow">
              <button class="cbtn" onclick="changeCounter('white', -1)">−</button>
              <div class="cval" id="whiteVal">0</div>
              <button class="cbtn" onclick="changeCounter('white', 1)">+</button>
            </div>
          </div>
        </div>
        <div class="fb-total-warning" id="fbWarning"></div>
        <div class="remaining" id="remaining"></div>
        <div class="poss-graph" id="possGraph"></div>
        <button class="btn" id="submitFeedbackBtn" onclick="submitFeedback()">Valider le feedback</button>
      </div>

      <button class="btn secondary hidden" id="undoBtn" onclick="undoLastMove()">↺ Annuler le dernier essai</button>
      <button class="btn secondary" onclick="resetToMenu()">↩ Changer de mode</button>
    </div>

    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const COLORS = [
  {name:'Rouge',  css:'var(--c0)'},
  {name:'Blanc',  css:'var(--c1)'},
  {name:'Jaune',  css:'var(--c2)'},
  {name:'Orange', css:'var(--c3)'},
  {name:'Bleu',   css:'var(--c4)'},
  {name:'Vert',   css:'var(--c5)'},
  {name:'Violet', css:'var(--c6)'},
  {name:'Rose',   css:'var(--c7)'},
];
const NB_TROUS = 4;
let NB_COULEURS = 8; // modifiable via le sélecteur du menu

let ALL_CODES = [];
function generateCodes(){
  ALL_CODES = [];
  function rec(prefix){
    if(prefix.length === NB_TROUS){ ALL_CODES.push(prefix); return; }
    for(let c=0;c<NB_COULEURS;c++) rec(prefix.concat([c]));
  }
  rec([]);
}
generateCodes();

let sessionScores = []; // {mode, numColors, attempts}

let mode = null;
let history = []; // {guess:[...], black, white}
let solved = false;

// mode userGuesses
let secretCode = null;
let currentGuess = [null,null,null,null];
let selectedSlot = 0;
let moveLimit = null; // null = illimité, sinon 8/10/12

// mode computerGuesses
let candidates = [];
let computerCurrentGuess = null;
let fbCounters = {black: 0, white: 0};
let possGraphHistory = []; // nombre de candidats restants après chaque coup

// undo stack: snapshots taken before each move is applied
let undoStack = [];

function feedback(guess, secret){
  let black = 0;
  const gCount = new Array(NB_COULEURS).fill(0);
  const sCount = new Array(NB_COULEURS).fill(0);
  for(let i=0;i<NB_TROUS;i++){
    if(guess[i] === secret[i]) black++;
    else { gCount[guess[i]]++; sCount[secret[i]]++; }
  }
  let white = 0;
  for(let c=0;c<NB_COULEURS;c++) white += Math.min(gCount[c], sCount[c]);
  return {black, white, code: black*10+white};
}

function codeKey(c){ return c.join(','); }

function bestGuess(candidatesList){
  if(candidatesList.length === 1) return candidatesList[0];

  const candidateSet = new Set(candidatesList.map(codeKey));
  let bestScore = Infinity;
  let best = null;

  for(const guess of ALL_CODES){
    const counts = {};
    for(const secret of candidatesList){
      const fb = feedback(guess, secret).code;
      counts[fb] = (counts[fb] || 0) + 1;
    }
    let worst = 0;
    for(const k in counts) if(counts[k] > worst) worst = counts[k];

    const guessInCandidates = candidateSet.has(codeKey(guess));
    const bestInCandidates = best ? candidateSet.has(codeKey(best)) : false;

    if(worst < bestScore || (worst === bestScore && guessInCandidates && !bestInCandidates)){
      bestScore = worst;
      best = guess;
    }
  }
  return best;
}

function startGame(chosenMode){
  mode = chosenMode;
  history = [];
  solved = false;
  undoStack = [];
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('undoBtn').classList.add('hidden');
  renderLegend();

  if(mode === 'userGuesses'){
    secretCode = ALL_CODES[Math.floor(Math.random() * ALL_CODES.length)];
    currentGuess = [null,null,null,null];
    selectedSlot = 0;
    document.getElementById('userInputArea').classList.remove('hidden');
    document.getElementById('feedbackInputArea').classList.add('hidden');
    renderSlots();
    renderPalette();
    renderAttemptsLeft();
    setStatus('Un code secret a été tiré au sort. À toi de jouer !');
  } else {
    candidates = ALL_CODES.slice();
    computerCurrentGuess = [0,0,1,1]; // équivalent de 1,1,2,2
    possGraphHistory = [ALL_CODES.length];
    document.getElementById('userInputArea').classList.add('hidden');
    document.getElementById('feedbackInputArea').classList.remove('hidden');
    resetCounters();
    renderComputerGuess();
    renderRemaining();
    renderPossGraph();
    setStatus("Pense à un code, sans me le dire. Voici ma première proposition ci-dessous.");
  }
  renderHistory();
}

function renderAttemptsPicker(){
  const el = document.getElementById('attemptsPicker');
  const options = [
    {label: 'Illimité', value: null},
    {label: '8', value: 8},
    {label: '10', value: 10},
    {label: '12', value: 12},
  ];
  el.innerHTML = options.map(o =>
    `<div class="cc-option ${o.value === moveLimit ? 'active' : ''}" onclick="setAttemptsLimit(${o.value})">${o.label}</div>`
  ).join('');
}

function setAttemptsLimit(n){
  moveLimit = n;
  renderAttemptsPicker();
}

function renderAttemptsLeft(){
  const el = document.getElementById('attemptsLeft');
  if(moveLimit === null){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const left = moveLimit - history.length;
  el.className = 'attempts-left' + (left <= 2 ? ' low' : '');
  el.innerHTML = `<b>${left}</b> essai${left>1?'s':''} restant${left>1?'s':''} sur ${moveLimit}`;
}

function renderPossGraph(){
  const el = document.getElementById('possGraph');
  const maxVal = Math.max(...possGraphHistory);
  el.innerHTML = possGraphHistory.map((count, idx) => {
    const heightPct = Math.max(4, (Math.log(count + 1) / Math.log(maxVal + 1)) * 100);
    const isCurrent = idx === possGraphHistory.length - 1;
    return `<div class="pg-bar ${isCurrent ? 'current' : ''}" style="height:${heightPct}%">
      <span class="pg-val">${count}</span>
    </div>`;
  }).join('');
}

function renderColorCountPicker(){
  const el = document.getElementById('colorCountPicker');
  el.innerHTML = [4, 6, 8].map(n =>
    `<div class="cc-option ${n === NB_COULEURS ? 'active' : ''}" onclick="setColorCount(${n})">${n}</div>`
  ).join('');
}

function setColorCount(n){
  NB_COULEURS = n;
  generateCodes();
  renderColorCountPicker();
  document.getElementById('subtitle').textContent = `${n} couleurs · 4 trous`;
}

function renderSessionHistory(){
  const el = document.getElementById('sessionHistory');
  if(sessionScores.length === 0){ el.innerHTML = ''; return; }

  const rows = sessionScores.map((s, idx) => {
    const modeLabel = s.mode === 'computerGuesses' ? "L'ordinateur devine" : 'Tu devines';
    const result = s.lost ? `<span style="color:var(--danger)">Perdu</span>` : `<b>${s.attempts} coups</b>`;
    return `<div class="sh-row"><span>Partie ${idx+1} · ${modeLabel} · ${s.numColors} couleurs</span>${result}</div>`;
  }).join('');

  el.innerHTML = `<div class="session-history"><div class="sh-title">Historique de cette session</div>${rows}</div>`;
}

function launchConfetti(){
  const colors = ['#e0453f','#f4efe4','#f2c94c','#ee8a2f','#3f7ec9','#3f9e6d','#8a4fc9','#ee6fa0'];
  const count = 40;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

renderColorCountPicker();
renderAttemptsPicker();

function resetToMenu(){
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('game').classList.add('hidden');
  renderSessionHistory();
  mode = null;
}

function setStatus(text, cls){
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function renderLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = COLORS.slice(0, NB_COULEURS).map(c => `<span><i style="background:${c.css}"></i>${c.name}</span>`).join('');
}

function renderHistory(){
  const el = document.getElementById('history');
  el.innerHTML = history.map((h, idx) => {
    const pegs = h.guess.map(ci => `<div class="peg" style="background:${COLORS[ci].css}"></div>`).join('');
    const fpegs = [];
    for(let i=0;i<h.black;i++) fpegs.push('<div class="fpeg black"></div>');
    for(let i=0;i<h.white;i++) fpegs.push('<div class="fpeg white"></div>');
    while(fpegs.length < 4) fpegs.push('<div class="fpeg none"></div>');
    return `<div class="row">
      <span class="num">${idx+1}</span>
      <div class="pegs">${pegs}</div>
      <div class="feedback-mini">${fpegs.join('')}</div>
    </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

/* ---------- Mode: userGuesses ---------- */

function renderSlots(){
  const el = document.getElementById('slots');
  el.innerHTML = currentGuess.map((ci, idx) => {
    const filled = ci !== null;
    const bg = filled ? COLORS[ci].css : 'var(--slot-empty)';
    const sel = idx === selectedSlot ? 'selected' : '';
    return `<div class="slot ${filled ? 'filled':''} ${sel}" style="background:${bg}" onclick="selectSlot(${idx})"></div>`;
  }).join('');
}

function selectSlot(idx){
  selectedSlot = idx;
  renderSlots();
}

function renderPalette(){
  const el = document.getElementById('palette');
  el.innerHTML = COLORS.slice(0, NB_COULEURS).map((c, idx) => `<div class="swatch" style="background:${c.css}" onclick="pickColor(${idx})" title="${c.name}"></div>`).join('');
}

function pickColor(colorIdx){
  currentGuess[selectedSlot] = colorIdx;
  if(selectedSlot < NB_TROUS - 1) selectedSlot++;
  renderSlots();
  document.getElementById('submitGuessBtn').disabled = currentGuess.some(c => c === null);
}

function submitUserGuess(){
  if(currentGuess.some(c => c === null)) return;

  undoStack.push({
    mode: 'userGuesses',
    historyLength: history.length
  });
  document.getElementById('undoBtn').classList.remove('hidden');

  const fb = feedback(currentGuess, secretCode);
  history.push({guess: currentGuess.slice(), black: fb.black, white: fb.white});
  renderHistory();

  if(fb.black === NB_TROUS){
    solved = true;
    setStatus(`🎉 Trouvé en ${history.length} coup${history.length>1?'s':''} !`, 'win');
    document.getElementById('userInputArea').classList.add('hidden');
    sessionScores.push({mode: 'userGuesses', numColors: NB_COULEURS, attempts: history.length});
    launchConfetti();
    return;
  }

  if(moveLimit !== null && history.length >= moveLimit){
    const secretLisible = secretCode.map(ci => COLORS[ci].name).join(', ');
    setStatus(`😔 Perdu ! Le code secret était : ${secretLisible}.`, '');
    document.getElementById('userInputArea').classList.add('hidden');
    sessionScores.push({mode: 'userGuesses', numColors: NB_COULEURS, attempts: history.length, lost: true});
    return;
  }

  currentGuess = [null,null,null,null];
  selectedSlot = 0;
  renderSlots();
  renderAttemptsLeft();
  document.getElementById('submitGuessBtn').disabled = true;
  setStatus(`Essai ${history.length} : ${fb.black} bien placé(s), ${fb.white} mal placé(s). À toi de rejouer.`);
}

/* ---------- Mode: computerGuesses ---------- */

function resetCounters(){
  fbCounters = {black: 0, white: 0};
  updateCounterDisplay();
}

function renderComputerGuess(){
  const el = document.getElementById('computerGuessDisplay');
  el.innerHTML = computerCurrentGuess.map(ci =>
    `<div class="slot filled" style="background:${COLORS[ci].css}"></div>`
  ).join('');
}

function updateCounterDisplay(){
  document.getElementById('blackVal').textContent = fbCounters.black;
  document.getElementById('whiteVal').textContent = fbCounters.white;

  const total = fbCounters.black + fbCounters.white;
  const warningEl = document.getElementById('fbWarning');
  warningEl.textContent = total > NB_TROUS ? `Le total ne peut pas dépasser ${NB_TROUS}.` : '';

  document.getElementById('submitFeedbackBtn').disabled = total > NB_TROUS;
}

function changeCounter(which, delta){
  const other = which === 'black' ? 'white' : 'black';
  const newVal = fbCounters[which] + delta;
  if(newVal < 0 || newVal > NB_TROUS) return;
  if(newVal + fbCounters[other] > NB_TROUS) return;
  fbCounters[which] = newVal;
  updateCounterDisplay();
}

function renderRemaining(){
  const el = document.getElementById('remaining');
  if(!el) return;
  el.innerHTML = `<b>${candidates.length}</b> combinaison${candidates.length>1?'s':''} encore possible${candidates.length>1?'s':''} sur ${ALL_CODES.length}`;
}

function submitFeedback(){
  const black = fbCounters.black;
  const white = fbCounters.white;

  // snapshot for undo, taken before mutating state
  undoStack.push({
    mode: 'computerGuesses',
    candidates: candidates.slice(),
    computerCurrentGuess: computerCurrentGuess.slice(),
    historyLength: history.length,
    possGraphHistory: possGraphHistory.slice()
  });
  document.getElementById('undoBtn').classList.remove('hidden');

  history.push({guess: computerCurrentGuess.slice(), black, white});
  renderHistory();

  if(black === NB_TROUS){
    solved = true;
    setStatus(`🎉 Trouvé en ${history.length} coup${history.length>1?'s':''} !`, 'win');
    document.getElementById('feedbackInputArea').classList.add('hidden');
    sessionScores.push({mode: 'computerGuesses', numColors: NB_COULEURS, attempts: history.length});
    launchConfetti();
    return;
  }

  candidates = candidates.filter(c => feedback(computerCurrentGuess, c).code === black*10+white);
  possGraphHistory.push(candidates.length);
  renderPossGraph();

  if(candidates.length === 0){
    setStatus("⚠️ Aucune combinaison ne correspond à ce feedback. Un des feedbacks précédents est peut-être incorrect — tu peux annuler le dernier essai.");
    document.getElementById('feedbackInputArea').classList.add('hidden');
    return;
  }

  setStatus('Je réfléchis à mon prochain coup…', 'thinking');
  document.getElementById('submitFeedbackBtn').disabled = true;

  setTimeout(() => {
    computerCurrentGuess = bestGuess(candidates);
    resetCounters();
    renderComputerGuess();
    renderRemaining();
    document.getElementById('submitFeedbackBtn').disabled = false;
    setStatus(`Essai ${history.length + 1} : voici ma proposition. Indique le résultat ci-dessus.`);
  }, 30);
}

function undoLastMove(){
  const snap = undoStack.pop();
  if(!snap) return;

  history = history.slice(0, snap.historyLength);
  renderHistory();

  if(snap.mode === 'userGuesses'){
    document.getElementById('userInputArea').classList.remove('hidden');
    currentGuess = [null,null,null,null];
    selectedSlot = 0;
    renderSlots();
    renderAttemptsLeft();
    document.getElementById('submitGuessBtn').disabled = true;
    setStatus(`Dernier essai annulé. Essai ${history.length + 1}, à toi de rejouer.`);
  }

  if(snap.mode === 'computerGuesses'){
    candidates = snap.candidates;
    computerCurrentGuess = snap.computerCurrentGuess;
    possGraphHistory = snap.possGraphHistory;
    resetCounters();
    renderComputerGuess();
    renderRemaining();
    renderPossGraph();
    document.getElementById('feedbackInputArea').classList.remove('hidden');
    document.getElementById('submitFeedbackBtn').disabled = false;
    setStatus(`Essai ${history.length + 1} : reprends la saisie du feedback pour cette proposition.`);
  }

  if(undoStack.length === 0) document.getElementById('undoBtn').classList.add('hidden');
}
</script>
